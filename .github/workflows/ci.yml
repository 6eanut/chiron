name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: pip install -e .[dev]

      - name: Import smoke check
        run: python -c "import chiron; import chiron.cli; import chiron.pipeline; import chiron.harness.validate"

      - name: CLI help smoke
        run: chiron --help

      - name: No-leakage guard
        run: pytest tests/ -q